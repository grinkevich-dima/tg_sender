services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg}
      POSTGRES_DB: tg
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg -d tg"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  tg-sender:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tg:${POSTGRES_PASSWORD:-tg}@postgres:5432/tg
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]   # наружу не открываем
    volumes:
      - ./data:/app/data
    # Боевой режим: код внутри собранного образа, без автоперезагрузки — правки в папке не попадают в работу,
    # пока не выполнена выкладка (scripts/deploy.sh). Режим разработки — docker-compose.dev.yml.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Бэкап раз в сутки: дамп Postgres + архив data/ в ./backups (хранение 14 дней). Разовый: docker compose run --rm backup once
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tg}
      KEEP_DAYS: "14"
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    restart: unless-stopped

  # Тесты: docker compose run --rm tests   (или scripts/test.sh)
  tests:
    profiles: ["test"]
    build: { context: ., args: { DEV: "1" } }
    environment:
      TEST_DATABASE_URL: postgresql://tg:${POSTGRES_PASSWORD:-tg}@postgres:5432/tg_test
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - .:/app
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]

volumes:
  pgdata:
